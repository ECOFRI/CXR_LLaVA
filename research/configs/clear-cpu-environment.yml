# APPROVED: isolated CPU one-image gate. Conda packages plus official CPU wheels.
name: cxr-clear-cpu
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.2.3
  - pillow=10.4.0
  - scipy=1.13.1
  - scikit-learn=1.5.2
  - matplotlib=3.9.2
  - h5py=3.11
  - tqdm=4.66
  - ftfy=6.3.1
  - regex
  - huggingface_hub=0.26.2
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.3.1+cpu
      - torchvision==0.18.1+cpu
